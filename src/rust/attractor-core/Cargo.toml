[package]
name = "attractor-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sprott strange attractors: orbit, discretisation, colouring and PNG output"

[lib]
name = "attractor_core"

[features]
# Progress bars on stderr (used by the CLI; the R package leaves this off)
progress = ["dep:indicatif"]
# Pure-Rust exp/ln instead of the C runtime's: much faster under the gnu
# Windows target that R packages are built with
libm = ["dep:libm"]

[dependencies]
colorgrad = "0.6.2"
image = "0.24.5"
libm = { version = "0.2", optional = true }
indicatif = { version = "0.17.2", optional = true }
ndarray = "0.15.6"
rayon = "1"
stats-cli = "3.0.1"
